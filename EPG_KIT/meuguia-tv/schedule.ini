version="2.00"
[settings]
	char set = "utf-8"
	update all days

[url]
	url = Compare(Num(Date.SpanDays(Date.Current, Date.Parse(Date(Date.Now, "yyyy-MM-dd"), "yyyy-MM-dd")), <, 14), "https://meuguia.tv/programacao/canal/" + Channel.Number + "?kit_date=" + Date(Date.Current, "yyyy-MM-dd"), "")

[global]
	!start = ", " + Date(Date.Current, "d'/'MM") + "</li>"
	finish = "            <li class=\"subheader devicepadding\">"

[container] all turn
	start = "<li>"

[container] var[time]
	!begin = "<div class='lileft time'>"
	!end = "</div>"
	trim spaces

[container] var[title]
	!begin = "<h2>"
	!end = "</h2>"
	decode html
	trim spaces

[time]
	result = Date.Parse(Var[time], "HH:mm")

[title]
	result = Var[title]
