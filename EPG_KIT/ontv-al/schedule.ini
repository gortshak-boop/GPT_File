version="2.00"
[settings]
	char set = "utf-8"
	update all days

[url]
	url = Channel.Number + "?day=" + Date(Date.Current, "yyyy-MM-dd")

[global]
	!start = "<h2 class=\"site-h3\">Schedule for "
	finish = "</main>"

[container] all turn
	start = "<li class=\"epg-row"

[container] var[stamp]
	!begin = "<time datetime=\""
	!end = "+00:00\""
	trim spaces

[container] var[title]
	!begin = "class=\"epg-title "
	!end = "<"
	remove before = ">"
	decode html
	trim spaces

[time]
	result = Date.Parse(Var[stamp], "yyyy-MM-dd'T'HH:mm:ss")
	includes date
	utc

[title]
	result = Var[title]
