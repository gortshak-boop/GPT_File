version="2.00"
[settings]
	char set = "utf-8"
	update all days

[url]
	url = Compare(Num(Date.SpanDays(Date.Current, Date.Parse(Date(Date.Now, "yyyy-MM-dd"), "yyyy-MM-dd")) >= 0), Compare(Num(Date.SpanDays(Date.Current, Date.Parse(Date(Date.Now, "yyyy-MM-dd"), "yyyy-MM-dd")) < 8), "https://panel.mlist.bid/epg.xml", ""), "")

[global]
	!start = "</channel>"
	finish = "</tv>"

[container] all turn
	start = "<programme "

[container] var[stamp]
	!begin = "start=\"" + Date(Date.Current, "yyyyMMdd")
	!end = " channel=\"" + Channel.Number + "\">"
	remove after = " +0000\""
	trim spaces

[container] var[title]
	!begin = " channel=\"" + Channel.Number + "\"><title lang=\"ru\">"
	!end = "</title>"
	decode html
	trim spaces

[time]
	result = Date.Parse(Date(Date.Current, "yyyyMMdd") + Var[stamp], "yyyyMMddHHmmss")
	includes date
	utc

[title]
	result = Var[title]
